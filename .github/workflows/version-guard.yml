name: Version Guard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: server.ts変更時にバージョン番号の更新を確認
        run: |
          # server.tsが変更されたか確認
          if git diff --name-only HEAD~1 HEAD | grep -q '^server\.ts$'; then
            echo "server.ts が変更されています。バージョン番号を確認します..."

            # 前のコミットと現在のpackage.jsonのversionを比較
            OLD_VERSION=$(git show HEAD~1:package.json | grep '"version"' | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
            NEW_VERSION=$(grep '"version"' package.json | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')

            echo "前のバージョン: $OLD_VERSION"
            echo "現在のバージョン: $NEW_VERSION"

            if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              echo ""
              echo "::error::バージョン番号を更新してください！server.ts が変更されていますが、package.json の version が $OLD_VERSION のままです。"
              exit 1
            else
              echo "OK: バージョンが $OLD_VERSION → $NEW_VERSION に更新されています。"
            fi
          else
            echo "server.ts は変更されていません。バージョンチェックをスキップします。"
          fi
